# monofonic_eu.conf — monofonIC configuration for EU ICs
# NB10 — Evaporating Universe 1024³ DM-only
# Generated: 2026-05-31 (NB10 v5-final)
#
# IMPORTANT: omega_cdm = 0.1193 IS the primordial value (NB10 v5 WARNING).
# DO NOT use 0.12479 — that would double-count the drain.

[setup]
GridRes         = 1024
BoxLength       = 500            # Mpc/h
zstart          = 49             # Initial redshift
LPTorder        = 2              # 2LPT (NEVER use 1LPT — transients, DT round 1)
DoBaryons       = no             # DM-only simulation
DoFixing        = yes            # Fix amplitude of modes (reduce variance)
DoInversion     = no

[cosmology]
transfer        = CLASS          # Use CLASS for transfer functions
# NOTE: For EU, we use CLASS with standard LCDM parameters.
# At z=49, f_cdm ≈ 0.999 — ICs are effectively identical to LCDM.
# The EU drain operates ONLY during Gadget-4 evolution.
Omega_m         = 0.29855        # (omega_b + omega_cdm_prim) / h²
Omega_b         = 0.04714        # omega_b / h²
Omega_L         = 0.70136        # 1 - Omega_m - Omega_r (approx)
H0              = 68.886         # km/s/Mpc
sigma_8         = 0.8275         # C2 posterior mean
n_s             = 0.9649
# A_s           = 2.1e-9         # Alternative to sigma_8 (use one or the other)
# NOTE: Using sigma_8 for normalization. Comment out sigma_8 and uncomment A_s to switch.

[random]
seed            = 42             # Fixed seed for reproducibility
                                 # If twin LCDM sim needed: use SAME seed (DT round 2)
generator       = NGENIC         # N-GenIC compatible RNG

[output]
format          = gadget_hdf5    # Gadget-4 HDF5 format
filename        = ./eu_ics_1024.hdf5

[poisson]
fft_fine        = yes
accuracy        = 1e-5
grad_order      = 6

