params:
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.022181
    proposal: 0.0001
    latex: \omega_b
    renames:
    - omegabh2
  omega_cdm:
    prior:
      min: 0.08
      max: 0.16
    ref: 0.119288
    proposal: 0.0005
    latex: \omega_{cdm}
    renames:
    - omegach2
  theta_s_100:
    prior:
      min: 1.03
      max: 1.05
    ref: 1.041806
    proposal: 0.0002
    latex: 100\theta_s
    drop: true
    renames: theta_MC_100
  100*theta_s:
    value: 'lambda theta_s_100: theta_s_100'
    derived: false
  tau_reio:
    prior:
      min: 0.01
      max: 0.12
    ref: 0.055882
    proposal: 0.005
    latex: \tau_{reio}
    renames:
    - tau
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.043688
    proposal: 0.01
    latex: \ln(10^{10}A_s)
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*__import__(''numpy'').exp(logA)'
    latex: A_s
    derived: true
    renames:
    - As
  n_s:
    prior:
      min: 0.9
      max: 1.05
    ref: 0.963855
    proposal: 0.003
    latex: n_s
    renames:
    - ns
  A_planck:
    prior:
      dist: norm
      loc: 1
      scale: 0.0025
    ref: 1.000643
    proposal: 0.0005
    latex: y_\mathrm{cal}
    renames: calPlanck
  H0:
    latex: H_0
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  Omega_m:
    latex: \Omega_m
    derived: true
    renames:
    - omegam
  rdrag:
    latex: r_{\rm drag}
    derived: true
    renames:
    - rs_drag
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8 * (Omega_m/0.3)**0.5'
    latex: S_8
  H0_LKI:
    derived: true
    latex: H_0^{\rm LKI}
  fcdm_z0:
    derived: true
    latex: f_{\rm cdm}(z{=}0)
  I_GKI:
    derived: true
    latex: I_{\rm GKI}
  use_fg_residual_model:
    value: 0
  cal0:
    value: 1
  cal2:
    value: 1
  amp_100:
    value: 0
  amp_143:
    prior:
      dist: uniform
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    latex: A^{\rm power}_{143}
    proposal: 1
  amp_217:
    prior:
      dist: uniform
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 20
      scale: 1
    latex: A^{\rm power}_{217}
    proposal: 1
  amp_143x217:
    prior:
      dist: uniform
      min: 0
      max: 50
    ref:
      dist: norm
      loc: 10
      scale: 1
    latex: A^{\rm power}_{143\times217}
    proposal: 1
  n_100:
    value: 1
  n_143:
    prior:
      dist: uniform
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    latex: \gamma^{\rm power}_{143}
    proposal: 0.2
  n_217:
    prior:
      dist: uniform
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    latex: \gamma^{\rm power}_{217}
    proposal: 0.2
  n_143x217:
    prior:
      dist: uniform
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 1
      scale: 0.2
    latex: \gamma^{\rm power}_{143\times217}
    proposal: 0.2
  calTE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{TE}
  calEE:
    prior:
      dist: norm
      loc: 1
      scale: 0.01
    ref:
      dist: norm
      loc: 1
      scale: 0.01
    proposal: 0.01
    latex: c_{EE}
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__CMB:
    latex: \chi^2_\mathrm{CMB}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 100
    max_tries: 10000
    covmat: covmat_C1.covmat
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.15
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: true
    blocking:
    - - 1
      - - omega_b
        - omega_cdm
        - theta_s_100
        - tau_reio
        - logA
        - n_s
    - - 7
      - - A_planck
    - - 7
      - - amp_143
        - amp_217
        - amp_143x217
        - n_143
        - n_217
        - n_143x217
        - calTE
        - calEE
    callback_function: null
    callback_every: null
    seed: null
    check_every: 240
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2
packages_path: packages
output: eu_NB05C_V2
timing: true
version: 3.6.2
